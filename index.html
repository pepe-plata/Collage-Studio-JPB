<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <title>Collage Studio JPB</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="https://cdn.jsdelivr.net/npm/fabric@5.3.0/dist/fabric.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <div class="splash" id="splash">
    <img src="icons/icon-512.png" alt="Collage Studio JPB">
  </div>

  <header class="app-header">
    <div class="header-left">
      <button id="btnMenu" class="icon-btn" title="Menú">☰</button>
      <h1>Collage Studio JPB</h1>
    </div>
    <div class="header-actions">
      <button id="btnUndo" class="icon-btn" title="Deshacer">↶</button>
      <button id="btnRedo" class="icon-btn" title="Rehacer">↷</button>
      <button id="btnExportar" class="icon-btn" title="Exportar">📤</button>
    </div>
  </header>

  <nav class="side-menu" id="sideMenu">
    <div class="side-menu-header"><span>Herramientas</span></div>
    <ul>
      <li data-panel="nuevo">✨ Nuevo</li>
      <li data-panel="formato">📐 Cambiar Tamaño</li>
      <li data-panel="fondo">🖼️ Fondo</li>
      <li data-panel="imagenes">📷 Insertar Imágenes...</li>
      <li data-panel="figuras">🔷 Figuras</li>
      <li data-panel="stickers">⭐ Stickers</li>
      <li data-panel="vector">🎨 Vectores</li>
      <li data-panel="texto">📝 Texto</li>
      <li data-panel="efectos">✨ Efectos</li>
      <li data-panel="filtros">🎞️ Filtros</li>
      <li data-panel="papel">📜 Papel</li>
      <li data-panel="mascaras">🎭 Máscaras</li>
      <li data-panel="proyecto">💾 Proyecto</li>
      <li data-panel="exportar">📤 Exportar</li>
      <li data-panel="ayuda"><img src="icons/help.png" alt="" class="menu-icon">Ayuda</li>
    </ul>
  </nav>

  <main class="workspace" id="workspace">
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="c"></canvas>
    </div>
  </main>

  <!-- BARRA NAV SUPERIOR DERECHA (arrastrable) -->
  <div class="nav-bar" id="navBar">
    <div class="nav-drag-handle" id="navDragHandle" title="Arrastrar">
      <span>⋮⋮</span>
    </div>
    <div class="nav-grid">
      <button data-nav="zoom-out" title="Zoom -">
        <img src="icons/zoomout.png" alt="Zoom -">
      </button>
      <button data-nav="pan-up" title="Arriba">
        <img src="icons/moveup.png" alt="Arriba">
      </button>
      <button data-nav="zoom-in" title="Zoom +">
        <img src="icons/zoomin.png" alt="Zoom +">
      </button>

      <button data-nav="pan-left" title="Izquierda">
        <img src="icons/moveleft.png" alt="Izquierda">
      </button>
      <button data-nav="zoom-fit" title="Ajustar a pantalla">
        <img src="icons/resetzoom.png" alt="Ajustar">
      </button>
      <button data-nav="pan-right" title="Derecha">
        <img src="icons/moveright.png" alt="Derecha">
      </button>

      <div class="nav-empty"></div>
      <button data-nav="pan-down" title="Abajo">
        <img src="icons/movedown.png" alt="Abajo">
      </button>
      <div class="nav-empty"></div>
    </div>
  </div>

  <!-- BARRA FLOTANTE INFERIOR -->
  <div class="floating-bar" id="floatingBar">
    <div class="floating-bar-actions">
      <button data-action="borrar" title="Eliminar"><img src="icons/delete.png" alt=""><span>Eliminar</span></button>
      <button data-action="duplicar" title="Duplicar"><img src="icons/duplicate.png" alt=""><span>Duplicar</span></button>
      <button data-action="frente" title="Al frente"><img src="icons/sendfront.png" alt=""><span>Frente</span></button>
      <button data-action="atras" title="Atrás"><img src="icons/sendback.png" alt=""><span>Atrás</span></button>
      <button data-action="recortar" title="Recortar"><img src="icons/scissors.png" alt=""><span>Recortar</span></button>
      <button data-action="rotar-izq" title="Rotar -90°"><img src="icons/rotate-left.png" alt=""><span>Rotar ↺</span></button>
      <button data-action="rotar-der" title="Rotar +90°"><img src="icons/rotate-right.png" alt=""><span>Rotar ↻</span></button>
      <button data-action="voltear-h" title="Voltear H"><img src="icons/fliphorizontal.png" alt=""><span>Voltear H</span></button>
      <button data-action="voltear-v" title="Voltear V"><img src="icons/flipvertical.png" alt=""><span>Voltear V</span></button>
    </div>
  </div>

  <aside class="panel" id="panel">
    <div class="panel-header">
      <h2 id="panelTitle">Panel</h2>
      <button id="btnCerrarPanel" class="icon-btn">✕</button>
    </div>
    <div class="panel-content" id="panelContent"></div>
  </aside>

  <div class="modal" id="cropModal">
    <div class="modal-content">
      <h3>✂️ Recortar imagen</h3>
      <canvas id="cropCanvas"></canvas>
      <div class="modal-actions">
        <button class="btn secondary" id="cropCancel">Cancelar</button>
        <button class="btn success" id="cropApply">Aplicar</button>
      </div>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
